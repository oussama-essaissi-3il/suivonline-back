spring.application.name=suivonline

# --- Base de donnees ---
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=suivonline
spring.jpa.properties.hibernate.default_schema=suivonline
spring.datasource.username=postgres
spring.datasource.password=postgres

# validate = Hibernate verifie que les entites correspondent aux tables, sans rien modifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT
# Cle secrete pour signer les tokens (au moins 32 caracteres)
jwt.secret=changez-cette-valeur-par-une-longue-chaine-aleatoire-secrete
# Duree de validite du token : 86 400 000 ms = 24 h
jwt.expiration-ms=86400000

# Adresse du front Nuxt (sert au CORS)
app.front-url=http://localhost:3000


